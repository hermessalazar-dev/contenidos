<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidad 1 - Fundamentos de Programación</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN to compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Lucide components for React
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const ref = React.useRef(null);
            useEffect(() => {
                if (ref.current) {
                    lucide.createIcons({
                        targets: [ref.current]
                    });
                }
            }, [name]);

            return <i data-lucide={name} className={className} ref={ref}></i>;
        };

        const Menu = (props) => <Icon name="menu" {...props} />;
        const X = (props) => <Icon name="x" {...props} />;
        const BookOpen = (props) => <Icon name="book-open" {...props} />;
        const Code = (props) => <Icon name="code" {...props} />;
        const Terminal = (props) => <Icon name="terminal" {...props} />;
        const Activity = (props) => <Icon name="activity" {...props} />;
        const FileText = (props) => <Icon name="file-text" {...props} />;
        const Cpu = (props) => <Icon name="cpu" {...props} />;
        const CheckCircle = (props) => <Icon name="check-circle" {...props} />;

        // Componente para mostrar bloques de código formateados
        const CodeBlock = ({ title, code, language = 'text' }) => (
            <div className="my-4 rounded-lg overflow-hidden border border-blue-100 shadow-sm">
                <div className="bg-blue-800 text-blue-100 text-xs font-mono px-4 py-2 border-b border-blue-700 flex justify-between">
                    <span>{title}</span>
                    <span className="uppercase opacity-75">{language}</span>
                </div>
                <pre className="p-4 bg-slate-900 text-blue-50 overflow-x-auto text-sm font-mono leading-relaxed">
                    <code>{code}</code>
                </pre>
            </div>
        );

        // Componente para resaltar las analogías
        const Analogy = ({ children }) => (
            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 my-6 rounded-r-lg shadow-sm">
                <div className="flex items-center mb-2">
                    <BookOpen className="text-blue-600 w-5 h-5 mr-2" />
                    <h4 className="font-bold text-blue-800">Analogía de aprendizaje</h4>
                </div>
                <p className="text-slate-700 leading-relaxed">{children}</p>
            </div>
        );

        // Componente para tarjetas de ejercicios
        const Exercise = ({ title, context, inputs, process, output }) => (
            <div className="bg-white border border-blue-200 p-6 rounded-lg shadow-sm my-4">
                <div className="flex items-center mb-3">
                    <Activity className="text-blue-600 w-5 h-5 mr-2" />
                    <h4 className="text-lg font-bold text-blue-800">{title}</h4>
                </div>
                <div className="space-y-3 text-slate-700 text-sm">
                    <p><strong>Contexto:</strong> {context}</p>
                    <div><strong>Datos de entrada:</strong>
                        <ul className="list-disc pl-5">{inputs.map((i, idx) => <li key={idx}>{i}</li>)}</ul>
                    </div>
                    <div><strong>Proceso:</strong>
                        <p>{process}</p>
                    </div>
                    <p><strong>Salida esperada:</strong> {output}</p>
                </div>
            </div>
        );

        function App() {
            const [activeTopic, setActiveTopic] = useState('t1');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const topics = [
                { id: 't1', title: '1. Metodología para la Solución', icon: <CheckCircle className="w-5 h-5" /> },
                { id: 't2', title: '2. Conceptos Básicos', icon: <Cpu className="w-5 h-5" /> },
                { id: 't3', title: '3. Tipos de Datos Básicos', icon: <FileText className="w-5 h-5" /> },
                { id: 't4', title: '4. Variables y Constantes', icon: <BookOpen className="w-5 h-5" /> },
                { id: 't5', title: '5. Operadores y Expresiones', icon: <Activity className="w-5 h-5" /> },
                { id: 't6', title: '6. Notación de Algoritmos', icon: <Code className="w-5 h-5" /> },
                { id: 't7', title: '7. Algoritmos Secuenciales', icon: <Terminal className="w-5 h-5" /> },
            ];

            const renderContent = () => {
                switch (activeTopic) {
                    case 't1':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">1. Metodología para la solución de problemas</h2>
                                <h3 className="text-xl font-bold text-blue-800 mt-6">Fundamento Teórico (Saber)</h3>
                                <p className="text-slate-700 leading-relaxed">
                                    Resolver problemas es la base de la programación. Siguiendo el método de George Pólya (1957), se plantea un proceso en cuatro pasos clave: <strong>1) Comprender el problema, 2) Establecer un plan, 3) Ejecutar el plan, y 4) Verificar la solución</strong>. En informática, un algoritmo es el conjunto finito y ordenado de instrucciones que materializa este plan para alcanzar un objetivo específico.
                                </p>
                                <Analogy>
                                    Imagina que planificas un viaje de vacaciones. Primero entiendes a dónde quieres ir (comprender el problema), luego trazas la ruta en un mapa (establecer un plan), después conduces siguiendo esa ruta paso a paso (ejecutar), y finalmente compruebas que has llegado a tu destino a tiempo (verificar). Así funciona la metodología en la programación.
                                </Analogy>
                                <h3 className="text-xl font-bold text-blue-800 mt-6">Metodología (Saber Hacer)</h3>
                                <ul className="list-decimal pl-6 space-y-2 text-slate-700 mb-6">
                                    <li><strong>Leer y entender el problema:</strong> Identificar datos de entrada, resultados deseados y restricciones.</li>
                                    <li><strong>Analizar la información:</strong> Ver qué datos tenemos y qué cálculos necesitamos aplicar.</li>
                                    <li><strong>Plantear un plan (Diseño):</strong> Dividir el problema en subtareas y decidir la secuencia de pasos (pseudocódigo o diagrama).</li>
                                    <li><strong>Implementar el plan:</strong> Traducir el algoritmo en código de programación (C#).</li>
                                    <li><strong>Verificar y revisar:</strong> Ejecutar con datos de prueba y corregir errores.</li>
                                </ul>
                                <h3 className="text-2xl font-bold text-blue-800 mt-8 mb-4">Ejemplo</h3>
                                <div className="bg-white p-6 rounded-xl border border-blue-100 shadow-sm">
                                    <h4 className="font-bold text-lg text-slate-800 mb-2">Problema: Costo Total de Compra</h4>
                                    <p className="text-sm text-slate-600 mb-4">Calcular el total a pagar sumando el precio del producto y el costo de envío ingresados por el usuario.</p>
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div>
                                            <h5 className="font-bold text-blue-700">1. Narrativa (Lenguaje Natural)</h5>
                                            <ol className="list-decimal pl-5 text-sm text-slate-700 space-y-1 mt-2">
                                                <li>Leer datos: Pedir al usuario que ingrese el precio del producto y el costo de envío.</li>
                                                <li>Calcular total: Sumar el precio del producto y el costo de envío.</li>
                                                <li>Mostrar resultado: Imprimir en pantalla el total calculado.</li>
                                            </ol>
                                        </div>
                                        <div>
                                            <h5 className="font-bold text-blue-700">2. Diagrama de Flujo (Lógica)</h5>
                                            <div className="bg-slate-50 p-3 rounded text-sm text-slate-600 font-mono mt-2 border border-slate-200 text-center">
                                                Inicio ➔ Leer(precio, envio) ➔ total = precio + envio ➔ Mostrar(total) ➔ Fin
                                            </div>
                                        </div>
                                    </div>
                                    <CodeBlock title="3. Pseudocódigo (PSeInt)" language="pseudo" code={`Inicio\nEscribir "Ingrese el precio del producto:"\nLeer precio\nEscribir "Ingrese el costo de envío:"\nLeer envio\ntotal = precio + envio\nEscribir "El costo total es:" , total\nFin`} />
                                    <CodeBlock title="4. Código C# (.NET Core)" language="csharp" code={`using System;\n\nclass CalculoTotal {\n    static void Main() {\n        // Entrada de datos\n        Console.WriteLine("Ingrese el precio del producto:");\n        double precio = Convert.ToDouble(Console.ReadLine());\n        \n        Console.WriteLine("Ingrese el costo de envío:");\n        double envio = Convert.ToDouble(Console.ReadLine());\n        \n        // Cálculo\n        double total = precio + envio;\n        \n        // Salida\n        Console.WriteLine($"El costo total es: {total:F2}");\n    }\n}`} />
                                </div>
                            </div>
                        );
                    case 't2':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">2. Conceptos Básicos de Algoritmos</h2>
                                <h3 className="text-xl font-bold text-blue-800 mt-6">Fundamento Teórico (Saber)</h3>
                                <p className="text-slate-700 leading-relaxed">
                                    Un algoritmo informático es una lista <strong>finita, ordenada y no ambigua</strong> de instrucciones que lleva de una entrada determinada a una solución. Toda nuestra vida está regida por algoritmos (seguir una receta, armar un mueble).
                                </p>
                                <Analogy>
                                    Un algoritmo es a la programación lo que una receta es a la cocina. Si omites un paso o cambias el orden, el resultado fracasa.
                                </Analogy>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    <div className="bg-white p-4 border-l-4 border-blue-400 shadow-sm"><strong className="text-blue-800">Finitud:</strong> Termina después de pasos limitados.</div>
                                    <div className="bg-white p-4 border-l-4 border-blue-400 shadow-sm"><strong className="text-blue-800">Precisión:</strong> Sin ambigüedades.</div>
                                </div>
                                <CodeBlock title="Pseudocódigo (PSeInt)" language="pseudo" code={`Inicio\nEscribir "Ingrese su nombre:"\nLeer nombre\nEscribir "Ingrese su edad actual:"\nLeer edadActual\nedadFutura = edadActual + 1\nEscribir "Hola " , nombre, ", el próximo año tendrás " , edadFutura, " años."\nFin`} />
                            </div>
                        );
                    case 't3':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">3. Tipos de Datos Básicos</h2>
                                <p className="text-slate-700 leading-relaxed">C# es un lenguaje fuertemente tipado.</p>
                                <div className="overflow-x-auto my-6 border border-blue-200 rounded-lg shadow-sm">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-blue-800 text-white">
                                                <th className="p-3">Tipo</th>
                                                <th className="p-3">Nombre C#</th>
                                                <th className="p-3">Ejemplo</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white">
                                            <tr className="border-b border-blue-100"><td className="p-3">Entero</td><td className="p-3">int</td><td className="p-3">25</td></tr>
                                            <tr className="border-b border-blue-100"><td className="p-3">Real</td><td className="p-3">double</td><td className="p-3">3.14</td></tr>
                                            <tr><td className="p-3">Cadena</td><td className="p-3">string</td><td className="p-3">"Hola"</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        );
                    case 't4':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">4. Variables y Constantes</h2>
                                <p className="text-slate-700">Contenido para variables y constantes...</p>
                                <CodeBlock title="Ejemplo C#" language="csharp" code={`double radio = 5.0; // Variable\nconst double PI = 3.1416; // Constante`} />
                            </div>
                        );
                    case 't5':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">5. Operadores y Expresiones</h2>
                                <p className="text-slate-700">Operadores aritméticos, relacionales y lógicos.</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-white p-4 border border-blue-100 rounded">Suma: + , Resta: - , Mult: * , Div: /</div>
                                    <div className="bg-white p-4 border border-blue-100 rounded">Igual: == , Diferente: != , Y: && , O: ||</div>
                                </div>
                            </div>
                        );
                    case 't6':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">6. Notación de Algoritmos</h2>
                                <p className="text-slate-700">Diagramas de flujo y Pseudocódigo.</p>
                                <div className="bg-white p-4 border border-blue-100 rounded">
                                    Óvalo: Inicio/Fin | Rectángulo: Proceso | Rombo: Decisión
                                </div>
                            </div>
                        );
                    case 't7':
                        return (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-3xl font-extrabold text-blue-900 border-b-2 border-blue-100 pb-2">7. Algoritmos Secuenciales</h2>
                                <p className="text-slate-700">Ejecución lineal paso a paso.</p>
                                <CodeBlock title="C# Secuencial" language="csharp" code={`Console.WriteLine("Paso 1");\nConsole.WriteLine("Paso 2");`} />
                            </div>
                        );
                    default:
                        return <div>Seleccione un tema</div>;
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans flex flex-col">
                    {/* Navbar para Móviles */}
                    <nav className="md:hidden bg-blue-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center space-x-2">
                            <BookOpen className="w-6 h-6 text-blue-300" />
                            <h1 className="font-bold text-lg">Fundamentos de Prog.</h1>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1 focus:outline-none focus:ring-2 focus:ring-blue-300 rounded">
                            {isMobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                        </button>
                    </nav>

                    {/* Menú móvil */}
                    {isMobileMenuOpen && (
                        <div className="md:hidden bg-blue-800 text-white shadow-inner">
                            <ul className="py-2 px-4 space-y-1">
                                {topics.map((topic) => (
                                    <li key={topic.id}>
                                        <button onClick={() => { setActiveTopic(topic.id); setIsMobileMenuOpen(false); }} className={`w-full text-left px-4 py-3 rounded text-sm transition-colors flex items-center ${activeTopic === topic.id ? 'bg-blue-600 font-bold' : 'hover:bg-blue-700'}`}>
                                            <span className="mr-3 opacity-80">{topic.icon}</span>
                                            {topic.title}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar Escritorio */}
                        <aside className="hidden md:flex flex-col w-80 bg-blue-900 text-white shadow-xl flex-shrink-0 sticky top-0 h-screen overflow-y-auto">
                            <div className="p-6 border-b border-blue-800 bg-blue-950">
                                <div className="flex items-center space-x-3 text-blue-100 mb-2">
                                    <BookOpen className="w-8 h-8" />
                                    <h1 className="text-xl font-black uppercase tracking-wider">Unidad 1</h1>
                                </div>
                                <p className="text-blue-300 text-sm font-medium">Algoritmos y Resolución</p>
                            </div>
                            <div className="flex-1 py-4 px-3">
                                <p className="text-xs uppercase tracking-widest text-blue-400 font-bold mb-4 ml-3">Temario</p>
                                <ul className="space-y-1">
                                    {topics.map((topic) => (
                                        <li key={topic.id}>
                                            <button onClick={() => setActiveTopic(topic.id)} className={`w-full text-left px-4 py-3 rounded-lg text-sm transition-all flex items-center ${activeTopic === topic.id ? 'bg-white text-blue-900 font-bold shadow-sm translate-x-1' : 'text-blue-100 hover:bg-blue-800 hover:text-white'}`}>
                                                <span className={`mr-3 ${activeTopic === topic.id ? 'text-blue-600' : 'text-blue-400'}`}>
                                                    {topic.icon}
                                                </span>
                                                {topic.title}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div className="p-4 border-t border-blue-800">
                                <a href="../index.html" className="flex items-center text-blue-300 hover:text-white text-sm">
                                    <Icon name="arrow-left" className="w-4 h-4 mr-2" /> Volver al Inicio
                                </a>
                            </div>
                        </aside>

                        {/* Contenido */}
                        <main className="flex-1 overflow-y-auto w-full">
                            <div className="max-w-4xl mx-auto p-6 md:p-10 pb-24">
                                {renderContent()}
                            </div>
                        </main>
                    </div>

                    <footer className="bg-white border-t border-blue-200 text-center py-4 text-slate-500 text-sm mt-auto relative z-40">
                        <p>Desarrollado por: <strong>MGA. Hermes Salazar Casanova.</strong></p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
